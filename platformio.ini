[platformio]
core_dir = .platformio
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*.cpp>
    +<sketch.ino>
    -<tests/>
    -<tools/>
    -<scripts/>
    -<.venv/>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.6.0
